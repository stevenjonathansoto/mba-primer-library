name: Free freshness monitoring
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/monitor.py
      - run: python scripts/check_sources.py --limit 100 --rotate
      - uses: actions/upload-artifact@v4
        with:
          name: freshness-review-queue
          path: |
            work/monitor.json
            work/source-reachability.json
