name: Validate library
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  library-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_config.py
      - run: python scripts/check_site.py
      - run: python scripts/check_legacy.py
      - run: python scripts/check_research.py
      - run: python -m unittest discover -s tests -v
