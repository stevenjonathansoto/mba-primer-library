name: Authorized primer intake
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: primer-paid-operations
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/intake.py
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('intake-result.json','utf8'));
            if (result.status === 'ignored') return;
            const config = JSON.parse(fs.readFileSync('config/agent.yaml','utf8'));
            const label = config.notifications.failure_label;
            try { await github.rest.issues.getLabel({...context.repo,name:label}); }
            catch (e) { if(e.status !== 404) throw e; await github.rest.issues.createLabel({...context.repo,name:label,color:'b60205'}); }
            await github.rest.issues.addLabels({...context.repo,issue_number:context.issue.number,labels:[label]});
            const marker = '<!-- mba-intake-status -->';
            const comments = await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:context.issue.number});
            const body = marker + '\n' + result.reason;
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if(previous) await github.rest.issues.updateComment({...context.repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({...context.repo,issue_number:context.issue.number,body});
